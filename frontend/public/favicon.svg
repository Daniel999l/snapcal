<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <clipPath id="lensClip">
      <circle cx="50" cy="50" r="30"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Aperture blades clipped to circle -->
  <g clip-path="url(#lensClip)">
    <rect x="45" y="22" width="10" height="26" rx="5" fill="white" opacity="0.88" transform="rotate(0 50 50)"/>
    <rect x="45" y="22" width="10" height="26" rx="5" fill="white" opacity="0.88" transform="rotate(60 50 50)"/>
    <rect x="45" y="22" width="10" height="26" rx="5" fill="white" opacity="0.88" transform="rotate(120 50 50)"/>
    <rect x="45" y="22" width="10" height="26" rx="5" fill="white" opacity="0.88" transform="rotate(180 50 50)"/>
    <rect x="45" y="22" width="10" height="26" rx="5" fill="white" opacity="0.88" transform="rotate(240 50 50)"/>
    <rect x="45" y="22" width="10" height="26" rx="5" fill="white" opacity="0.88" transform="rotate(300 50 50)"/>
  </g>

  <!-- Lens center cap -->
  <circle cx="50" cy="50" r="14" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="14" fill="none" stroke="white" stroke-width="1.5" opacity="0.35"/>

  <!-- Inner dot (calorie spark) -->
  <circle cx="50" cy="50" r="6" fill="white"/>
  <circle cx="50" cy="50" r="3.5" fill="#f97316"/>
</svg>
