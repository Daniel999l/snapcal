<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <clipPath id="lensClip">
      <circle cx="40" cy="40" r="24"/>
    </clipPath>
  </defs>

  <!-- Icon background -->
  <rect width="80" height="80" rx="18" fill="url(#bg)"/>

  <!-- Aperture blades -->
  <g clip-path="url(#lensClip)">
    <rect x="36" y="17" width="8" height="21" rx="4" fill="white" opacity="0.88" transform="rotate(0 40 40)"/>
    <rect x="36" y="17" width="8" height="21" rx="4" fill="white" opacity="0.88" transform="rotate(60 40 40)"/>
    <rect x="36" y="17" width="8" height="21" rx="4" fill="white" opacity="0.88" transform="rotate(120 40 40)"/>
    <rect x="36" y="17" width="8" height="21" rx="4" fill="white" opacity="0.88" transform="rotate(180 40 40)"/>
    <rect x="36" y="17" width="8" height="21" rx="4" fill="white" opacity="0.88" transform="rotate(240 40 40)"/>
    <rect x="36" y="17" width="8" height="21" rx="4" fill="white" opacity="0.88" transform="rotate(300 40 40)"/>
  </g>

  <!-- Lens center cap -->
  <circle cx="40" cy="40" r="11" fill="url(#bg)"/>
  <circle cx="40" cy="40" r="11" fill="none" stroke="white" stroke-width="1.5" opacity="0.35"/>

  <!-- Calorie spark -->
  <circle cx="40" cy="40" r="5" fill="white"/>
  <circle cx="40" cy="40" r="2.8" fill="#f97316"/>

  <!-- Wordmark -->
  <text
    font-family="'Manrope', 'Segoe UI', system-ui, sans-serif"
    font-size="36"
    font-weight="800"
    y="52"
  >
    <tspan x="96" fill="#111827">Snap</tspan><tspan fill="#22c55e">Cal</tspan>
  </text>
</svg>
